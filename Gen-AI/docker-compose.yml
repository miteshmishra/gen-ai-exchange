version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travel_hub_db
    environment:
      POSTGRES_DB: travel_hub
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: